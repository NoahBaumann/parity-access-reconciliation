  function normSummary(n) {
    const labels = { trim: "Trim whitespace", caseInsensitive: "Case insensitive", dedupeSpaces: "Collapse repeated spaces", ignoreBlank: "Ignore blank rows", ignoreDuplicates: "Ignore duplicates" };
    const on = Object.keys(labels).filter((k) => n[k]).map((k) => labels[k]);
    const rules = (n.customRules || []).length;
    return (on.length ? on.join(", ") : "None") + (rules ? " · " + rules + " custom rule" + (rules === 1 ? "" : "s") : "");
  }
  function renderApplicationDetail(p) {
    const recons = listRecons().filter((r) => r.profileId === p.id);
    const tree = recons.length
      ? '<div class="tree">' + recons.map((r) => {
          const st = reconStatus(r);
          return '<div class="tree-cycle"><div class="tree-cycle-head"><a href="#/recon/' + r.id + '">' + esc(r.cycle || "No certification cycle") + "</a>" + statusBadge(st) + '</div><div class="tree-runs">' +
            r.runs.map((run) => '<div class="tree-run"><a href="#/recon/' + r.id + "/run/" + run.runNumber + '">Run ' + run.runNumber + '</a><span class="faint">' + fmtDate(run.timestamp) + '</span><span class="mono">' + fmtNum(trueMismatchCount(run)) + " " + plural(trueMismatchCount(run), "exception", "exceptions") + "</span></div>").join("") +
            "</div></div>";
        }).join("") + "</div>"
      : '<p class="muted">No certification cycles yet. Start a reconciliation with this profile to create the first one.</p>';
    return (
      '<div class="topbar"><div><div class="crumb"><a href="#/applications">Applications</a> / ' + esc(p.name) + '</div><div class="page-title">' + esc(p.name) + (p.isDemo ? ' <span class="tag-demo">Demo</span>' : "") + "</div></div>" +
        '<div class="btn-row"><button type="button" class="btn btn-danger" id="btnDeleteProfile">Delete profile</button><a class="btn btn-primary" href="#/new/profile/' + p.id + '">New reconciliation</a></div></div>' +
      '<div class="content"><div class="card"><div class="card-title">Saved configuration</div>' +
        kvRow("IGA platform", esc(p.igaPlatform || "—")) + kvRow("Comparison key", comparisonKeyLabel(p.includeAccount)) +
        kvRow("Source mapping", mappingSummary(p.mapping.source)) + kvRow("IGA mapping", mappingSummary(p.mapping.iga)) +
        kvRow("Normalization", esc(normSummary(p.normalization))) +
        kvRow("Expected headers", (p.expectedSourceHeaders || []).length + " source · " + (p.expectedIgaHeaders || []).length + " IGA") +
        kvRow("Last certification cycle", esc(p.lastCycle || "—")) + "</div>" +
      '<div class="card"><div class="card-title">Certification cycles and runs</div>' + tree + "</div></div>"
    );
  }
  const kvRow = (k, v) => '<div class="kv-row"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
  function bindApplicationDetail(p) {
    const b = qs("#btnDeleteProfile");
    if (b && p) b.onclick = () => {
      if (confirm("Delete the profile \u201c" + p.name + "\u201d? Existing reconciliations and their run history are kept.")) { delete STATE.profiles[p.id]; saveState(); navigate("applications"); }
    };
  }

  /* ============================== WIZARD ============================== */
  let WIZ = null;
  const WIZARD_STEPS = ["Application", "Source File", "IGA File", "Mapping", "Options", "Review"];

  function freshWizard(kind, refId) {
    const w = {
      routeKey: (kind || "start") + ":" + (refId || ""), mode: "scratch", intent: kind === "newprofile" ? "new" : "scratch", step: 0, reconId: null, profileId: null,
      appName: "", cycle: "", saveProfile: false, igaPlatform: "",
      sourceParsed: null, igaParsed: null, mapping: { source: {}, iga: {} }, savedMapping: null,
      includeAccount: false, savedIncludeAccount: false, keyDowngraded: false, normalization: cloneNorm(),
      expected: { source: [], iga: [] }, structure: { source: null, iga: null }, missing: { source: {}, iga: {} }
    };
    if (kind === "recon") {
      const r = getRecon(refId);
      if (r) {
        w.mode = "recon"; w.reconId = r.id; w.step = 1; w.appName = r.name; w.cycle = r.cycle || "";
        w.profileId = getProfile(r.profileId) ? r.profileId : null;
        w.mapping = clone(r.lastMapping); w.savedMapping = clone(r.lastMapping);
        w.includeAccount = w.savedIncludeAccount = !!r.lastIncludeAccount;
        w.normalization = cloneNorm(r.lastNormalization);
        w.expected = { source: r.expectedSourceHeaders || [], iga: r.expectedIgaHeaders || [] };
      }
    } else if (kind === "profile") {
      const p = getProfile(refId);
      if (p) applyProfile(w, p);
    } else if (kind === "newprofile") {
      w.saveProfile = true;
    }
    return w;
  }
  function applyProfile(w, p) {
    w.mode = "profile"; w.intent = "profile"; w.profileId = p.id; w.appName = p.name; w.igaPlatform = p.igaPlatform || "";
    w.mapping = clone(p.mapping); w.savedMapping = clone(p.mapping);
    w.includeAccount = w.savedIncludeAccount = !!p.includeAccount; w.keyDowngraded = false;
    w.normalization = cloneNorm(p.normalization);
    w.expected = { source: p.expectedSourceHeaders || [], iga: p.expectedIgaHeaders || [] };
    w.saveProfile = false;
  }
  function resetToScratch(w) {
    w.mode = "scratch"; w.profileId = null; w.appName = ""; w.igaPlatform = "";
    w.mapping = { source: {}, iga: {} }; w.savedMapping = null; w.includeAccount = false; w.savedIncludeAccount = false; w.keyDowngraded = false;
    w.normalization = cloneNorm(); w.expected = { source: [], iga: [] };
  }
  const sideParsed = (side) => (side === "source" ? WIZ.sourceParsed : WIZ.igaParsed);
  const hasConfig = () => (WIZ.mode === "profile" || WIZ.mode === "recon") && !!WIZ.savedMapping;
  const configLabel = () => (WIZ.profileId ? WIZ.appName + " profile" : "Previous run mapping");

  /* Applies saved mappings to a freshly uploaded file. Columns that no longer exist are cleared and flagged, never silently remapped. */
  function applyConfigToSide(side) {
    const parsed = sideParsed(side);
    WIZ.missing[side] = {};
    if (!parsed) { WIZ.structure[side] = null; return; }
    const fields = parsed.fields;
    if (!hasConfig()) {
      const m = WIZ.mapping[side];
      Object.keys(m).forEach((k) => { if (m[k] && fields.indexOf(m[k]) === -1) m[k] = ""; });
      WIZ.structure[side] = null;
      return;
    }
    const saved = WIZ.savedMapping[side] || {};
    const m = {}; let changed = false;
    Object.keys(saved).forEach((k) => {
      if (!saved[k]) { m[k] = ""; return; }
      if (fields.indexOf(saved[k]) !== -1) m[k] = saved[k]; else { m[k] = ""; WIZ.missing[side][k] = saved[k]; changed = true; }
    });
    (WIZ.expected[side] || []).forEach((h) => { if (fields.indexOf(h) === -1) changed = true; });
    WIZ.mapping[side] = m;
    WIZ.structure[side] = changed ? "changed" : "recognized";
  }

  function renderWizard(kind, refId) {
    const routeKey = (kind || "start") + ":" + (refId || "");
    if (!WIZ || WIZ.routeKey !== routeKey) WIZ = freshWizard(kind, refId);
    const bodies = [stepApplication, () => stepUpload("source"), () => stepUpload("iga"), stepMapping, stepOptions, stepReview];
    const title = WIZ.mode === "recon" ? "Run new comparison — " + esc(reconTitle({ name: WIZ.appName, cycle: WIZ.cycle })) : "New reconciliation";
    return '<div class="topbar"><div><div class="crumb"><a href="#/reconciliations">Reconciliations</a> / New</div><div class="page-title">' + title + "</div></div></div>" +
      '<div class="content content-narrow">' + progressHtml(WIZ.step) + '<div class="card">' + bodies[WIZ.step]() + "</div></div>";
  }
  function progressHtml(current) {
    return '<div class="progress" aria-label="Progress">' + WIZARD_STEPS.map((label, i) => {
      const st = i < current ? "done" : i === current ? "current" : "future";
      return (i ? '<span class="p-line ' + (i <= current ? "done" : "") + '"></span>' : "") +
        '<span class="p-step ' + st + '"' + (st === "current" ? ' aria-current="step"' : "") + '><span class="p-dot">' + (st === "done" ? ICONS.checkWhite : "") + "</span>" + label + "</span>";
    }).join("") + "</div>";
  }
  function actions(o) {
    return '<div class="wizard-actions">' + (o.back ? '<button type="button" class="btn" id="wizBack">Back</button>' : "<span></span>") +
      '<button type="button" class="btn btn-primary" id="' + o.id + '" ' + (o.disabled ? "disabled" : "") + ">" + (o.label || "Continue") + "</button></div>";
  }

  /* ----- Step 0: Application ----- */
  function stepApplication() {
    const profiles = listProfiles();
    const scratchSel = WIZ.mode === "scratch";
    const newSel = scratchSel && WIZ.intent === "new", scratchOnly = scratchSel && WIZ.intent !== "new";
    const check = '<span class="pc-check">' + ICONS.checkWhite + "</span>";
    const cards = profiles.map((p) => profileCard(p, { selected: WIZ.mode === "profile" && WIZ.profileId === p.id })).join("") +
      '<button type="button" class="profile-card action ' + (newSel ? "selected" : "") + '" data-profile="__new">' + (newSel ? check : "") + '<div class="pc-name">' + ICONS.plus + ' New Application Profile</div><div class="pc-plat">Map once, reuse every cycle</div></button>' +
      '<button type="button" class="profile-card action ' + (scratchOnly ? "selected" : "") + '" data-profile="">' + (scratchOnly ? check : "") + '<div class="pc-name">Start from scratch</div><div class="pc-plat">Map columns for this run only</div></button>';
    const prof = WIZ.mode === "profile" ? getProfile(WIZ.profileId) : null;
    return (
      '<label class="field-label" style="margin-bottom:10px;display:block;">' + (profiles.length ? "Use a saved application profile or start from scratch" : "Application") + "</label>" +
      '<div class="profile-grid" style="margin-bottom:20px;">' + cards + "</div>" +
      (scratchSel
        ? '<div class="field"><label class="field-label" for="wizApp">Application name <span class="req-mark">*</span></label><input type="text" id="wizApp" placeholder="e.g. Oracle ERP" value="' + esc(WIZ.appName) + '"></div>'
        : '<div class="field"><label class="field-label">Application</label><div style="font-weight:600;">' + esc(WIZ.appName) + '</div><p class="field-hint">Saved mappings, comparison key and normalization settings will be applied.</p></div>') +
      '<div class="field"><label class="field-label" for="wizCycle">Certification cycle <span class="faint" style="font-weight:400;">(optional)</span></label><input type="text" id="wizCycle" placeholder="e.g. 2026 1H" value="' + esc(WIZ.cycle) + '">' +
        '<p class="field-hint">Groups runs under a cycle such as 2026 Q1, 2026 1H or 2026 Q3 SOX.' + (prof && prof.lastCycle ? " Last used: " + esc(prof.lastCycle) + "." : "") + "</p></div>" +
      actions({ id: "wizNext0" })
    );
  }

  /* ----- Steps 1-2: Upload ----- */
  function structureBanner(side) {
    const st = WIZ.structure[side];
    if (!st) return "";
    if (st === "recognized") return '<div class="banner ok">' + ICONS.check + "<span>" + esc(configLabel()) + " recognized — saved mappings applied</span></div>";
    const miss = Object.keys(WIZ.missing[side]).map((k) => WIZ.missing[side][k]);
    return '<div class="banner warn">' + ICONS.info + "<span>" + (side === "source" ? "Source" : "IGA") + " file structure has changed. Review mappings before continuing." +
      (miss.length ? '<span class="b-sub">Mapped columns not found in this file: ' + miss.map(esc).join(", ") + "</span>" : "") + "</span></div>";
  }
  function stepUpload(which) {
    const isSource = which === "source";
    const parsed = sideParsed(which);
    const title = isSource ? "Source File" : "IGA File";
    const desc = isSource ? "Export from your authoritative source system (for example Oracle ERP)." : "Export from your IGA certification or staging population (for example SailPoint or Saviynt).";
    let area;
    if (parsed) {
      area = '<div class="file-card"><span class="fc-icon">' + ICONS.check + '</span><div class="fc-body"><div class="fc-name">' + esc(parsed.fileName) + '</div><div class="fc-meta">' + fmtNum(parsed.rowCount) + " rows · " + parsed.fields.length + " columns</div>" +
        '<div class="fc-hash">SHA-256: ' + hashChip(parsed.sha256, false) + '</div></div><button type="button" class="btn btn-sm" id="btnChange_' + which + '">Change file</button></div>' + structureBanner(which);
    } else {
      area = '<label class="dropzone" id="dz_' + which + '" for="file_' + which + '" tabindex="0" role="button">' + ICONS.upload +
        '<span class="dz-main">Click to choose a CSV file</span><span class="dz-sub">or drag and drop</span><span class="dz-note">CSV only · processed locally</span>' +
        '<input type="file" accept=".csv,text/csv" id="file_' + which + '"></label>';
    }
    let preview = "";
    if (parsed) {
      preview = '<div class="divider-note">Preview — first ' + Math.min(10, parsed.data.length) + " rows</div>" +
        '<div class="preview-scroll"><table class="data"><thead><tr>' + parsed.fields.map((c) => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
        parsed.data.slice(0, 10).map((row) => "<tr>" + parsed.fields.map((c) => '<td class="mono">' + esc(row[c]) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    }
    return '<label class="field-label" style="display:block;">' + title + '</label><p class="field-hint" style="margin:0 0 12px 0;">' + desc + '</p><div id="uploadArea">' + area + "</div>" + preview +
      actions({ back: !(WIZ.mode === "recon" && WIZ.step === 1), id: "wizNext" + WIZ.step, disabled: !parsed });
  }

  /* ----- Step 3: Mapping + comparison key ----- */
  function mappingColumn(which, title, fields, m) {
    const sel = (key, label, required) => {
      const miss = WIZ.missing[which][key];
      return '<div class="field"><label class="field-label">' + label + (required ? ' <span class="req-mark">*</span>' : ' <span class="faint" style="font-weight:400;">(optional)</span>') + "</label>" +
        '<select class="mapSelect" data-which="' + which + '" data-field="' + key + '"><option value="">' + (required ? "Select column…" : "Not mapped") + "</option>" +
        fields.map((f) => '<option value="' + esc(f) + '" ' + (f === m[key] ? "selected" : "") + ">" + esc(f) + "</option>").join("") + "</select>" +
        (miss ? '<div class="miss-hint">Previously mapped to \u201c' + esc(miss) + "\u201d — not found in this file.</div>" : "") + "</div>";
    };
    return '<div class="mapping-col"><h4>' + title + "</h4>" + sel("identity", "Identity field", true) + sel("entitlement", "Entitlement field", true) +
      sel("account", "Account", false) + sel("application", "Application", false) + sel("description", "Entitlement description", false) + sel("displayName", "User display name", false) + "</div>";
  }
  const accountMappedBoth = () => !!(WIZ.mapping.source.account && WIZ.mapping.iga.account);
  function enforceKey() {
    if (WIZ.includeAccount && !accountMappedBoth()) { WIZ.includeAccount = false; if (WIZ.savedIncludeAccount) WIZ.keyDowngraded = true; }
  }
  function keyPanel() {
    enforceKey();
    const ok = accountMappedBoth();
    return '<div class="checkbox-row ' + (ok ? "" : "disabled") + '"><input type="checkbox" id="keyInclAcct" ' + (WIZ.includeAccount ? "checked" : "") + " " + (ok ? "" : "disabled") + '>' +
      '<label for="keyInclAcct"><div class="cb-title">Include Account in comparison key</div><div class="cb-desc">' + (ok ? "Matches on identity, account and entitlement together." : "Available once an Account column is mapped in both files.") + "</div></label></div>" +
      '<p style="margin-top:8px;font-size:13px;">Comparison key: <strong>' + comparisonKeyLabel(WIZ.includeAccount) + "</strong></p>" +
      (WIZ.keyDowngraded && !WIZ.includeAccount ? '<div class="banner warn">' + ICONS.info + "<span>The saved setup used Account in the comparison key, but the Account column is no longer mapped in both files.</span></div>" : "");
  }
  function mappingValid() {
    const ok = (side) => { const p = sideParsed(side), m = WIZ.mapping[side]; return !!(m.identity && m.entitlement && p.fields.indexOf(m.identity) !== -1 && p.fields.indexOf(m.entitlement) !== -1); };
    return ok("source") && ok("iga");
  }
  function stepMapping() {
    const changed = ["source", "iga"].filter((s) => WIZ.structure[s] === "changed");
    return '<label class="field-label" style="margin-bottom:12px;display:block;">Map columns from each file</label>' +
      (changed.length ? '<div class="banner warn" style="margin:0 0 16px 0;">' + ICONS.info + "<span>" + changed.map((s) => (s === "source" ? "Source" : "IGA") + " file structure has changed.").join(" ") + " Review mappings before continuing.</span></div>" : "") +
      '<div class="form-grid-2">' + mappingColumn("source", "Source File", WIZ.sourceParsed.fields, WIZ.mapping.source) + mappingColumn("iga", "IGA File", WIZ.igaParsed.fields, WIZ.mapping.iga) + "</div>" +
      '<h3 class="step-h">Comparison key</h3><div class="option-list" id="keyPanel">' + keyPanel() + "</div>" +
      actions({ back: true, id: "wizNext3", disabled: !mappingValid() });
  }

  /* ----- Step 4: Options ----- */
  function stepOptions() {
    const n = WIZ.normalization;
    const row = (key, title, desc) => '<div class="checkbox-row"><input type="checkbox" data-norm="' + key + '" ' + (n[key] ? "checked" : "") + ' id="norm_' + key + '"><label for="norm_' + key + '"><div class="cb-title">' + title + '</div><div class="cb-desc">' + desc + "</div></label></div>";
    return '<label class="field-label" style="margin-bottom:4px;display:block;">Normalization options</label><p class="field-hint" style="margin:0 0 12px 0;">Applied to values before the comparison key is built.</p>' +
      '<div class="option-list">' +
        row("trim", "Trim whitespace", "Removes spaces at the start and end of each value.") +
        row("caseInsensitive", "Case insensitive comparison", "Treats \u201cAP_Approver\u201d and \u201cAP_APPROVER\u201d as the same value.") +
        row("dedupeSpaces", "Collapse repeated spaces", "Collapses repeated spaces inside a value into one.") +
        row("ignoreBlank", "Ignore blank rows", "Skips rows where identity or entitlement is empty.") +
        row("ignoreDuplicates", "Ignore duplicate identity + entitlement pairs", "Duplicates are collapsed to one relationship for matching. Detected duplicates are always listed under Duplicate.") + "</div>" +
      '<details class="advanced" ' + ((n.customRules || []).length ? "open" : "") + '><summary>Advanced normalization rules <span class="faint" style="font-weight:400;">— custom find &amp; replace, including regex</span></summary><div class="adv-body">' +
        '<p class="field-hint" style="margin:0 0 12px 0;">Add substitutions when the source and IGA name things differently — for example stripping an application prefix. Rules run in order, before the options above. Matches that depend on a custom rule are labeled \u201cCustom-rule normalized match\u201d. Nothing else is transformed automatically: identities such as C12345 and E12345 stay distinct unless you add a rule.</p>' +
        '<div id="rulesPanel">' + rulesPanel() + '</div><div id="rulesPreview" style="margin-top:14px;">' + rulesPreview() + "</div></div></details>" +
      actions({ back: true, id: "wizNext4" });
  }
  function rulesPanel() {
    const rules = WIZ.normalization.customRules || [];
    return '<div class="rules-box">' + (rules.length
      ? '<div class="rule-grid rule-grid-head"><span>Applies to</span><span>Find</span><span>Replace with</span><span>Options</span><span></span></div>' + rules.map(ruleRow).join("")
      : '<p class="faint" style="margin:2px 0 12px 0;">No custom rules.</p>') +
      '<button type="button" class="btn btn-sm" id="btnAddRule" style="margin-top:' + (rules.length ? "10px" : "0") + ';">' + ICONS.plus + " Add rule</button></div>";
  }
  function ruleRow(r) {
    return '<div class="rule-grid rule-row"><select class="ruleScope" data-id="' + r.id + '">' + RULE_SCOPES.map((s) => '<option value="' + s.value + '" ' + (s.value === r.scope ? "selected" : "") + ">" + s.label + "</option>").join("") + "</select>" +
      '<input type="text" class="ruleFind" data-id="' + r.id + '" placeholder="e.g. ORCL_" value="' + esc(r.find) + '"><input type="text" class="ruleReplace" data-id="' + r.id + '" placeholder="(blank removes it)" value="' + esc(r.replace) + '">' +
      '<div class="rule-toggles"><label><input type="checkbox" class="ruleRegex" data-id="' + r.id + '" ' + (r.useRegex ? "checked" : "") + '> Regex</label><label><input type="checkbox" class="ruleCase" data-id="' + r.id + '" ' + (r.matchCase ? "checked" : "") + '> Match case</label></div>' +
      '<button type="button" class="btn btn-sm btn-quiet ruleRemove" data-id="' + r.id + '" aria-label="Remove rule" title="Remove rule">' + ICONS.x + '</button><div class="rule-error" id="ruleError_' + r.id + '"></div></div>';
  }
  function sampleValues(side, field, limit) {
    const p = sideParsed(side), col = WIZ.mapping[side][field];
    if (!p || !col) return [];
    const seen = {}, out = [];
    for (let i = 0; i < p.data.length && out.length < limit; i++) { const v = p.data[i][col]; if (!seen[str(v)]) { seen[str(v)] = true; out.push(v); } }
    return out;
  }
  function rulesPreview() {
    const secs = [["source", "identity", "Source identity"], ["source", "entitlement", "Source entitlement"], ["iga", "identity", "IGA identity"], ["iga", "entitlement", "IGA entitlement"]];
    let rows = "";
    secs.forEach(([side, field, label]) => sampleValues(side, field, 2).forEach((raw) => {
      const out = normalizeValue(raw, WIZ.normalization, { side, field });
      rows += '<tr><td class="faint">' + label + '</td><td class="mono">' + esc(display(raw)) + '</td><td class="mono" style="' + (str(raw) !== out ? "color:var(--accent);font-weight:600;" : "") + '">' + esc(display(out)) + "</td></tr>";
    }));
    if (!rows) return '<p class="faint" style="font-size:12.5px;">Sample values appear once both files are uploaded and mapped.</p>';
    return '<div class="divider-note">Live preview using values from your files</div><div class="table-wrap no-max"><table class="data"><thead><tr><th>Field</th><th>Original</th><th>After normalization</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }
  const findRule = (id) => (WIZ.normalization.customRules || []).find((r) => r.id === id);
  const refreshPreview = () => { const h = qs("#rulesPreview"); if (h) h.innerHTML = rulesPreview(); };
  function ruleErrorUpdate(rule) { const s = qs("#ruleError_" + rule.id); if (s) { const r = applyOneRule("sample-test-123", rule); s.textContent = r.error ? r.error + " — this rule will be skipped." : ""; } }
  function bindRules() {
    qsa(".ruleScope").forEach((el) => { el.onchange = () => { const r = findRule(el.dataset.id); if (r) { r.scope = el.value; refreshPreview(); } }; });
    qsa(".ruleFind").forEach((el) => { el.oninput = () => { const r = findRule(el.dataset.id); if (r) { r.find = el.value; ruleErrorUpdate(r); refreshPreview(); } }; });
    qsa(".ruleReplace").forEach((el) => { el.oninput = () => { const r = findRule(el.dataset.id); if (r) { r.replace = el.value; refreshPreview(); } }; });
    qsa(".ruleRegex").forEach((el) => { el.onchange = () => { const r = findRule(el.dataset.id); if (r) { r.useRegex = el.checked; ruleErrorUpdate(r); refreshPreview(); } }; });
    qsa(".ruleCase").forEach((el) => { el.onchange = () => { const r = findRule(el.dataset.id); if (r) { r.matchCase = el.checked; refreshPreview(); } }; });
    qsa(".ruleRemove").forEach((el) => { el.onclick = () => { WIZ.normalization.customRules = WIZ.normalization.customRules.filter((r) => r.id !== el.dataset.id); qs("#rulesPanel").innerHTML = rulesPanel(); bindRules(); refreshPreview(); }; });
    const add = qs("#btnAddRule");
    if (add) add.onclick = () => { WIZ.normalization.customRules.push({ id: uid(), scope: "all", find: "", replace: "", useRegex: false, matchCase: false }); qs("#rulesPanel").innerHTML = rulesPanel(); bindRules(); refreshPreview(); };
  }

  /* ----- Step 5: Review ----- */
  function mergeTarget() {
    if (WIZ.reconId) return getRecon(WIZ.reconId);
    const c = (WIZ.cycle || "").trim().toLowerCase();
    if (!WIZ.profileId || !c) return null;
    return listRecons().find((r) => r.profileId === WIZ.profileId && !r.isDemo && (r.cycle || "").trim().toLowerCase() === c) || null;
  }
  function fileBlock(label, parsed) {
    return '<div class="kv-section">' + label + " file</div>" + kvRow("Filename", '<span class="mono">' + esc(parsed.fileName) + "</span>") + kvRow("Row count", '<span class="mono">' + fmtNum(parsed.rowCount) + "</span>") + kvRow("SHA-256", hashChip(parsed.sha256, false));
  }
  function stepReview() {
    const n = WIZ.normalization, rules = n.customRules || [];
    const target = mergeTarget();
    const prof = getProfile(WIZ.profileId);
    let save;
    if (prof) {
      save = '<div class="checkbox-row"><input type="checkbox" id="wizSave" ' + (WIZ.saveProfile ? "checked" : "") + '><label for="wizSave"><div class="cb-title">Update saved profile with these settings</div><div class="cb-desc">Updates \u201c' + esc(prof.name) + "\u201d with the mappings, comparison key and normalization used here.</div></label></div>";
    } else {
      save = '<div class="checkbox-row"><input type="checkbox" id="wizSave" ' + (WIZ.saveProfile ? "checked" : "") + '><label for="wizSave"><div class="cb-title">Save these settings as an Application Profile</div><div class="cb-desc">Reuse this setup for future certification cycles.</div></label></div>' +
        '<div id="platWrap" style="' + (WIZ.saveProfile ? "" : "display:none;") + 'padding:0 0 10px 26px;"><label class="field-label" for="wizPlat">IGA platform <span class="faint" style="font-weight:400;">(optional)</span></label><input type="text" id="wizPlat" placeholder="e.g. SailPoint IIQ" value="' + esc(WIZ.igaPlatform) + '"></div>';
    }
    return '<label class="field-label" style="display:block;">Review &amp; run</label>' +
      '<div class="kv-section" style="margin-top:8px;">Reconciliation</div>' + kvRow("Application", esc(WIZ.appName)) + kvRow("Certification cycle", esc(WIZ.cycle || "—")) +
      kvRow("Comparison key", "<strong>" + comparisonKeyLabel(WIZ.includeAccount) + "</strong>") +
      fileBlock("Source", WIZ.sourceParsed) + fileBlock("IGA", WIZ.igaParsed) +
      '<div class="kv-section">Mapping and normalization</div>' + kvRow("Source", mappingSummary(WIZ.mapping.source)) + kvRow("IGA", mappingSummary(WIZ.mapping.iga)) + kvRow("Normalization", esc(normSummary(n))) +
      (rules.length ? kvRow("Custom rules", rules.map((r) => esc(ruleScopeLabel(r.scope)) + ": \u201c" + esc(r.find) + "\u201d \u2192 \u201c" + esc(r.replace) + "\u201d" + (r.useRegex ? " (regex)" : "")).join("<br>")) : "") +
      (target ? '<div class="banner info">' + ICONS.info + "<span>This will be added as Run " + (target.runs.length + 1) + " of " + esc(reconTitle(target)) + ".</span></div>" : "") +
      '<h3 class="step-h">Application profile</h3><div class="option-list">' + save + "</div>" +
      '<div class="banner">' + ICONS.lock + "<span>" + PRIVACY + "</span></div>" +
      actions({ back: true, id: "wizRun", label: "Run parity check" });
  }

  /* ----- Wizard bindings ----- */
  function captureStep0() {
    const a = qs("#wizApp"), c = qs("#wizCycle");
    if (a) WIZ.appName = a.value;
    if (c) WIZ.cycle = c.value;
  }
  async function handleFile(which, file) {
    try {
      const [parsed, hash] = await Promise.all([parseCSVFile(file), sha256OfFile(file)]);
      parsed.fileName = file.name; parsed.sha256 = hash;
      if (which === "source") WIZ.sourceParsed = parsed; else WIZ.igaParsed = parsed;
      applyConfigToSide(which);
      render();
    } catch (err) { console.error(err); alert("Could not read that CSV file. Please check the file and try again."); }
  }
  function bindWizard() {
    const back = qs("#wizBack");
    if (back) back.onclick = () => { WIZ.step--; render(); };
    if (WIZ.step === 0) {
      qsa("[data-profile]").forEach((b) => {
        b.onclick = () => {
          captureStep0();
          const id = b.dataset.profile;
          if (id === "__new") { resetToScratch(WIZ); WIZ.intent = "new"; WIZ.saveProfile = true; }
          else if (id) applyProfile(WIZ, getProfile(id));
          else { resetToScratch(WIZ); WIZ.intent = "scratch"; WIZ.saveProfile = false; }
          ["source", "iga"].forEach(applyConfigToSide);
          render();
        };
      });
      const next = qs("#wizNext0");
      next.onclick = () => {
        captureStep0();
        if (!WIZ.appName.trim()) { const a = qs("#wizApp"); if (a) { a.focus(); a.style.borderColor = "var(--danger)"; } return; }
        WIZ.appName = WIZ.appName.trim(); WIZ.cycle = WIZ.cycle.trim(); WIZ.step = 1; render();
      };
    }
    if (WIZ.step === 1 || WIZ.step === 2) {
      const which = WIZ.step === 1 ? "source" : "iga";
      const input = qs("#file_" + which), dz = qs("#dz_" + which);
      if (input) input.onchange = () => { if (input.files && input.files[0]) handleFile(which, input.files[0]); };
      if (dz) {
        dz.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
        dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
        dz.ondragleave = () => dz.classList.remove("drag");
        dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("drag"); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(which, f); };
      }
      const change = qs("#btnChange_" + which);
      if (change) change.onclick = () => { if (which === "source") WIZ.sourceParsed = null; else WIZ.igaParsed = null; WIZ.structure[which] = null; WIZ.missing[which] = {}; render(); };
      qs("#wizNext" + WIZ.step).onclick = () => { WIZ.step++; render(); };
    }
    if (WIZ.step === 3) {
      const refresh = () => {
        const kp = qs("#keyPanel"); kp.innerHTML = keyPanel(); bindKey();
        qs("#wizNext3").disabled = !mappingValid();
      };
      const bindKey = () => { const cb = qs("#keyInclAcct"); if (cb) cb.onchange = () => { WIZ.includeAccount = cb.checked; refresh(); }; };
      qsa(".mapSelect").forEach((s) => { s.onchange = () => { WIZ.mapping[s.dataset.which][s.dataset.field] = s.value; delete WIZ.missing[s.dataset.which][s.dataset.field]; refresh(); }; });
      bindKey();
      qs("#wizNext3").onclick = () => { enforceKey(); WIZ.step = 4; render(); };
    }
    if (WIZ.step === 4) {
      qsa("[data-norm]").forEach((cb) => { cb.onchange = () => { WIZ.normalization[cb.dataset.norm] = cb.checked; refreshPreview(); }; });
      bindRules();
      qs("#wizNext4").onclick = () => { WIZ.step = 5; render(); };
    }
    if (WIZ.step === 5) {
      const save = qs("#wizSave"), wrap = qs("#platWrap"), plat = qs("#wizPlat");
      if (save) save.onchange = () => { WIZ.saveProfile = save.checked; if (wrap) wrap.style.display = save.checked ? "" : "none"; };
      if (plat) plat.oninput = () => { WIZ.igaPlatform = plat.value; };
      qs("#wizRun").onclick = executeRun;
    }
  }

  function executeRun() {
    enforceKey();
    const includeAccount = WIZ.includeAccount && accountMappedBoth();
    const result = runComparison(WIZ.sourceParsed.data, WIZ.igaParsed.data, WIZ.mapping, WIZ.normalization, includeAccount);
    const now = new Date().toISOString();
    let recon = mergeTarget();
    if (!recon) {
      recon = { id: uid(), name: WIZ.appName, cycle: WIZ.cycle || "", profileId: null, createdAt: now, runs: [] };
      STATE.reconciliations[recon.id] = recon;
    }
    recon.lastMapping = clone(WIZ.mapping); recon.lastIncludeAccount = result.includeAccount; recon.lastNormalization = clone(WIZ.normalization);
    recon.expectedSourceHeaders = WIZ.sourceParsed.fields.slice(); recon.expectedIgaHeaders = WIZ.igaParsed.fields.slice();

    let prof = getProfile(WIZ.profileId);
    if (WIZ.saveProfile) {
      if (!prof) { prof = { id: uid(), name: WIZ.appName, createdAt: now }; STATE.profiles[prof.id] = prof; prof.igaPlatform = (WIZ.igaPlatform || "").trim(); }
      prof.mapping = clone(WIZ.mapping); prof.includeAccount = result.includeAccount; prof.normalization = clone(WIZ.normalization);
      prof.expectedSourceHeaders = WIZ.sourceParsed.fields.slice(); prof.expectedIgaHeaders = WIZ.igaParsed.fields.slice(); prof.updatedAt = now;
    }
    if (prof) { if (WIZ.cycle) prof.lastCycle = WIZ.cycle; recon.profileId = prof.id; }

    pushRun(recon, {
      sourceFileName: WIZ.sourceParsed.fileName, igaFileName: WIZ.igaParsed.fileName, sourceRowCount: WIZ.sourceParsed.rowCount, igaRowCount: WIZ.igaParsed.rowCount,
      sourceFileHash: WIZ.sourceParsed.sha256, igaFileHash: WIZ.igaParsed.sha256, normalization: clone(WIZ.normalization)
    }, result, now);
    saveState();
    const runNumber = recon.runs.length;
    WIZ = null;
    navigate("recon/" + recon.id + "/run/" + runNumber);
  }

  /* ============================== RECONCILIATION DETAIL ============================== */
  function renderReconDetail(recon) {
    const trend = recon.runs.map(trueMismatchCount);
    const trendHtml = trend.length
      ? '<div class="trend-chain">' + trend.map((v, i) => (i ? '<span class="trend-arrow">\u2192</span>' : "") + '<span class="trend-node ' + (v === 0 ? "zero" : "") + '">' + v + "</span>").join("") + "</div>"
      : '<span class="faint">No runs yet</span>';
    const rows = recon.runs.slice().reverse().map((run) =>
      '<a class="list-row" href="#/recon/' + recon.id + "/run/" + run.runNumber + '"><div><div class="lr-name">Run ' + run.runNumber + '</div><div class="faint" style="font-size:12px;">' + fmtDateTime(run.timestamp) + "</div></div>" +
      '<div class="mono">' + pctOrDash(sourceCompletenessValue(run)) + '</div><div class="mono">' + pctOrDash(igaAlignmentValue(run)) + '</div><div class="mono">' + fmtNum(trueMismatchCount(run)) + "</div>" +
      '<div class="mono">' + fmtNum(Math.max(run.sourceRelationships, run.igaRelationships)) + "</div><div>" + statusBadge(runStatus(run)) + '</div><div class="chev">' + ICONS.chevron + "</div></a>").join("");
    const hdr = '<div class="list-row list-head">' + ["Run", "Completeness", "Alignment", "Exceptions", "Relationships", "Status"].map((h) => '<div class="lr-label">' + h + "</div>").join("") + "<div></div></div>";
    const last = latestRun(recon);
    const prof = getProfile(recon.profileId);
    return '<div class="topbar"><div><div class="crumb"><a href="#/reconciliations">Reconciliations</a> / ' + esc(reconTitle(recon)) + '</div><div class="page-title">' + esc(reconTitle(recon)) + (recon.isDemo ? ' <span class="tag-demo">Demo</span>' : "") + "</div>" +
      '<div class="page-sub">' + (last ? "Comparison key: " + comparisonKeyLabel(last.includeAccount) : "") + (prof ? ' · Profile: <a href="#/application/' + prof.id + '">' + esc(prof.name) + "</a>" : "") + "</div></div>" +
      '<a class="btn btn-primary" href="#/new/recon/' + recon.id + '">Run New Comparison</a></div>' +
      '<div class="content"><div class="card"><div class="card-title">Exception trend across runs</div><p class="faint" style="font-size:12px;margin:-6px 0 12px 0;">Missing from IGA + Missing from Source only. Duplicates and formatting differences are tracked separately.</p>' + trendHtml + "</div>" +
      '<div class="section"><div class="section-head"><h2 class="section-title">Run history</h2></div><div class="surface">' + (rows ? hdr + rows : '<div class="table-empty">No runs recorded yet.</div>') + "</div></div></div>";
  }

  /* ============================== RUN RESULTS ============================== */
  let EXC_FILTER = "all", EXC_SEARCH = "";
  const EXC_TYPES = ["Missing from IGA", "Missing from Source", "Duplicate", "Formatting / normalized match", "Custom-rule normalized match"];
  const TYPE_TONE = { "Missing from IGA": "warning", "Missing from Source": "warning", "Duplicate": "purple", "Formatting / normalized match": "neutral", "Custom-rule normalized match": "info" };

  function statusBanner(run) {
    const a = run.missingFromIgaCount || 0, b = run.missingFromSourceCount || 0;
    const d = run.duplicateCount || 0, f = formattingCount(run);
    const notes = [];
    if (d) notes.push(fmtNum(d) + " duplicate " + plural(d, "relationship", "relationships"));
    if (f) notes.push(fmtNum(f) + " formatting-only " + plural(f, "match", "matches"));
    const note = notes.length ? '<div class="sb-note">' + notes.join(" and ") + " " + (notes.length === 1 ? plural(d || f, "is", "are") : "are") + " also listed for review.<br>These do not affect parity.</div>" : "";
    if (!a && !b) {
      return '<div class="status-banner in"><span class="sb-icon">' + ICONS.okCircle + '</span><div><div class="sb-title">Parity achieved</div><div class="sb-body">Source and IGA populations are fully reconciled.</div>' + note + "</div></div>";
    }
    let msg;
    if (a && b) msg = fmtNum(a) + " " + plural(a, "relationship is", "relationships are") + " missing from IGA and " + fmtNum(b) + " " + plural(b, "is", "are") + " missing from the source.";
    else if (a) msg = fmtNum(a) + " " + plural(a, "relationship is", "relationships are") + " missing from IGA.";
    else msg = fmtNum(b) + " " + plural(b, "relationship is", "relationships are") + " missing from the source.";
    return '<div class="status-banner out"><span class="sb-icon">' + ICONS.warnTri + '</span><div><div class="sb-title">Out of parity</div><div class="sb-body">' + msg + "</div>" + note + "</div></div>";
  }
  function renderRunResults(recon, n) {
    const run = recon.runs.find((r) => r.runNumber === n);
    if (!run) return notFound("Run not found.", "#/recon/" + recon.id);
    EXC_FILTER = "all"; EXC_SEARCH = "";
    const dup = run.duplicateCount || 0;
    const counts = { all: run.exceptions.length };
    EXC_TYPES.forEach((t) => { counts[t] = run.exceptions.filter((e) => e.exceptionType === t).length; });
    const chips = ["all"].concat(EXC_TYPES).map((t) => '<button type="button" class="chip-filter ' + (t === "all" ? "active" : "") + '" data-exc-filter="' + esc(t) + '">' + (t === "all" ? "All" : t) + " (" + counts[t] + ")</button>").join("");
    return (
      '<div class="topbar"><div><div class="crumb"><a href="#/reconciliations">Reconciliations</a> / <a href="#/recon/' + recon.id + '">' + esc(reconTitle(recon)) + "</a> / Run " + run.runNumber + '</div>' +
        '<div class="page-title">' + esc(reconTitle(recon)) + (recon.isDemo ? ' <span class="tag-demo">Demo</span>' : "") + '</div><div class="page-sub">Run ' + run.runNumber + " · " + fmtDate(run.timestamp) + " · Comparison key: " + comparisonKeyLabel(run.includeAccount) + "</div></div>" +
        '<div class="btn-row"><a class="btn" href="#/recon/' + recon.id + "/run/" + run.runNumber + '/evidence">Evidence Summary</a><a class="btn btn-primary" href="#/new/recon/' + recon.id + '">Run New Comparison</a></div></div>' +
      '<div class="content">' + statusBanner(run) +
        '<div class="metric-grid" id="metricGrid">' +
          metric("Source Relationships", fmtNum(run.sourceRelationships)) + metric("IGA Relationships", fmtNum(run.igaRelationships)) +
          metric("Exact Matches", fmtNum(run.matchedCount), "success") + metric("Duplicates", fmtNum(dup), dup > 0 ? "purple" : "") +
          metric("Missing from IGA", fmtNum(run.missingFromIgaCount), run.missingFromIgaCount > 0 ? "warning" : "") + metric("Missing from Source", fmtNum(run.missingFromSourceCount), run.missingFromSourceCount > 0 ? "warning" : "") +
          metric("Source Completeness", pctOrDash(sourceCompletenessValue(run)), "accent", "Exact matches \u00f7 source relationships") + metric("IGA Population Alignment", pctOrDash(igaAlignmentValue(run)), "accent", "Exact matches \u00f7 IGA relationships") +
        "</div>" +
        '<div class="section"><div class="section-head"><h2 class="section-title">Exceptions</h2></div><div class="surface">' +
          '<div class="toolbar"><div class="filter-group" id="filterGroup">' + chips + "</div>" +
            '<div class="btn-row"><div class="search-input-wrap">' + ICONS.search + '<input type="search" id="excSearch" placeholder="Search identity or entitlement" aria-label="Search exceptions"></div><button type="button" class="btn btn-sm" id="btnExport">Export CSV</button></div></div>' +
          '<div id="exceptionTableHost">' + exceptionTable(run) + "</div></div></div></div>"
    );
  }
  function filteredExceptions(run) {
    const s = EXC_SEARCH.toLowerCase();
    return run.exceptions.filter((e) => (EXC_FILTER === "all" || e.exceptionType === EXC_FILTER) &&
      (!s || str(e.identity).toLowerCase().includes(s) || str(e.entitlement).toLowerCase().includes(s) || str(e.account).toLowerCase().includes(s)));
  }
  function statusCell(t) {
    if (t === "Absent") return '<span class="faint">Absent</span>';
    if (t.indexOf("(\u00d7") !== -1) return '<span class="dup-count">' + esc(t) + "</span>";
    return esc(t);
  }
  function exceptionTable(run) {
    const rows = filteredExceptions(run);
    if (!rows.length) return '<div class="table-wrap flat"><div class="table-empty">No exceptions match this filter.</div></div>';
    return '<div class="table-wrap flat"><table class="data"><thead><tr><th>Identity</th><th>Entitlement</th><th>Source status</th><th>IGA status</th><th>Exception type</th></tr></thead><tbody>' +
      rows.map((e) => '<tr><td class="mono">' + esc(e.identity) + (run.includeAccount && e.account != null ? '<span class="cell-detail">Account: ' + esc(e.account) + "</span>" : "") + '</td><td class="mono">' + esc(e.entitlement) + "</td><td>" + statusCell(e.sourceStatus) + "</td><td>" + statusCell(e.igaStatus) + '</td><td><span class="badge badge-' + (TYPE_TONE[e.exceptionType] || "neutral") + '">' + esc(e.exceptionType) + "</span></td></tr>").join("") +
      "</tbody></table></div>";
  }
  function bindRunResults(recon, n) {
    const run = recon.runs.find((r) => r.runNumber === n);
    if (!run) return;
    const host = qs("#exceptionTableHost");
    qsa("[data-exc-filter]").forEach((b) => {
      b.onclick = () => {
        EXC_FILTER = b.dataset.excFilter;
        qsa("[data-exc-filter]").forEach((x) => x.classList.toggle("active", x === b));
        host.innerHTML = exceptionTable(run);
      };
    });
    qs("#excSearch").oninput = (e) => { EXC_SEARCH = e.target.value; host.innerHTML = exceptionTable(run); };
    qs("#btnExport").onclick = () => {
      const rows = filteredExceptions(run).map((e) => {
        const o = { Identity: e.identity };
        if (run.includeAccount) o.Account = e.account;
        o.Entitlement = e.entitlement; o["Source Status"] = e.sourceStatus; o["IGA Status"] = e.igaStatus; o["Exception Type"] = e.exceptionType;
        return o;
      });
      downloadCSV(reconTitle(recon).replace(/[^a-z0-9]+/gi, "_").toLowerCase() + "_run" + run.runNumber + "_exceptions.csv", rows);
    };
  }

  /* ============================== EVIDENCE SUMMARY ============================== */
  function renderEvidence(recon, n) {
    const run = recon.runs.find((r) => r.runNumber === n);
    if (!run) return notFound("Run not found.", "#/recon/" + recon.id);
    const st = runStatus(run), norm = run.normalization || {};
    const a = run.missingFromIgaCount || 0, b = run.missingFromSourceCount || 0;
    const sub = st.inParity ? "Source and IGA populations are fully reconciled." : (a ? fmtNum(a) + " missing from IGA" : "") + (a && b ? " · " : "") + (b ? fmtNum(b) + " missing from source" : "");
    const flags = [["trim", "Trim whitespace"], ["caseInsensitive", "Case insensitive comparison"], ["dedupeSpaces", "Collapse repeated spaces"], ["ignoreBlank", "Ignore blank rows"], ["ignoreDuplicates", "Ignore duplicate identity + entitlement pairs"]]
      .map((p) => kvRow(p[1], norm[p[0]] ? "Enabled" : "Not enabled")).join("");
    const rules = norm.customRules || [];
    const rulesHtml = kvRow("Custom normalization rules", rules.length ? rules.map((r) => esc(ruleScopeLabel(r.scope)) + ": \u201c" + esc(r.find) + "\u201d \u2192 \u201c" + esc(r.replace) + "\u201d" + (r.useRegex ? " (regex)" : "") + (r.matchCase ? ", match case" : "")).join("<br>") : "None used");
    const mono = (v) => '<span class="mono">' + v + "</span>";
    const file = (label, name, rows, hash) => '<div class="kv-section">' + label + "</div>" + kvRow("Filename", mono(esc(name))) + kvRow("Row count", mono(fmtNum(rows))) + kvRow("SHA-256", hashChip(hash, true));
    const statusVal = '<span class="badge badge-' + st.tone + '"><span class="dot"></span>' + (st.inParity ? "Parity achieved" : "Out of parity") + '</span><span class="ev-status-sub">' + sub + "</span>";
    return (
      '<div class="topbar no-print"><div><div class="crumb"><a href="#/recon/' + recon.id + "/run/" + run.runNumber + '">Run ' + run.runNumber + '</a> / Evidence Summary</div><div class="page-title">Evidence Summary</div></div>' +
        '<button type="button" class="btn btn-primary" id="btnPrint">Export Evidence Summary</button></div>' +
      '<div class="content"><div class="evidence-doc">' +
        '<div class="ev-head"><div class="ev-brand">' + logo(34) + '<div><div class="b1">Parity</div><div class="b2">Access Reconciliation</div></div></div><div class="ev-stamp">Generated<br><span class="mono">' + fmtDateTime(new Date().toISOString()) + "</span></div></div>" +
        '<h1 class="ev-title">Evidence Summary</h1><p class="ev-lede">Source-versus-IGA population reconciliation record</p>' +
        '<div class="kv-section">Reconciliation Details</div>' + kvRow("Application", esc(recon.name)) + kvRow("Certification cycle", esc(recon.cycle || "—")) + kvRow("Run", mono(run.runNumber)) + kvRow("Run timestamp", mono(fmtDateTime(run.timestamp))) +
        kvRow("Comparison key", "<strong>" + comparisonKeyLabel(run.includeAccount) + "</strong>") + kvRow("Parity status", statusVal) +
        file("Source File", run.sourceFileName, run.sourceRowCount, run.sourceFileHash) + file("IGA File", run.igaFileName, run.igaRowCount, run.igaFileHash) +
        '<div class="kv-section">Results</div>' + kvRow("Source relationships", mono(fmtNum(run.sourceRelationships))) + kvRow("IGA relationships", mono(fmtNum(run.igaRelationships))) + kvRow("Exact matches", mono(fmtNum(run.matchedCount))) +
        kvRow("Duplicates", mono(fmtNum(run.duplicateCount))) + kvRow("Missing from IGA", mono(fmtNum(a))) + kvRow("Missing from Source", mono(fmtNum(b))) +
        kvRow("Source Completeness", mono(pctOrDash(sourceCompletenessValue(run)))) + kvRow("IGA Population Alignment", mono(pctOrDash(igaAlignmentValue(run)))) +
        '<div class="kv-section">Normalization</div>' + flags + rulesHtml +
        '<div class="ev-foot">' + PRIVACY + "</div></div></div>"
    );
  }
  function bindEvidence() { const b = qs("#btnPrint"); if (b) b.onclick = () => window.print(); }

  /* ============================== SETTINGS ============================== */
  function renderSettings() {
    const rc = listRecons().length, pc = listProfiles().length;
    return '<div class="topbar"><div class="page-title">Settings</div></div><div class="content content-narrow">' +
      '<div class="card"><div class="card-title">Privacy</div><div class="banner" style="margin-top:0;">' + ICONS.lock + "<span>" + PRIVACY + "</span></div></div>" +
      '<div class="card"><div class="card-title">Local data</div><p class="muted" style="margin-bottom:14px;">This browser currently stores ' + rc + " " + plural(rc, "reconciliation", "reconciliations") + " and " + pc + " application " + plural(pc, "profile", "profiles") + '.</p><button type="button" class="btn btn-danger" id="btnClear">Clear all local data</button></div></div>';
  }
  function bindSettings() {
    const b = qs("#btnClear");
    if (b) b.onclick = () => { if (confirm("This permanently deletes all reconciliations, run history and application profiles stored in this browser. Continue?")) { STATE = emptyState(); saveState(); navigate("app"); } };
  }

  /* ============================== TEST HOOK (inert unless a harness defines it) ============================== */
  if (window.__PARITY_TEST__) Object.assign(window.__PARITY_TEST__, { runComparison, sha256OfText, sha256OfFile, DEFAULT_NORM, cloneNorm, getState: () => STATE });

  render();
})();
</script>
</body>
</html>
