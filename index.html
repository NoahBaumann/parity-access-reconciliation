<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parity — Access Reconciliation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Ccircle cx='10.5' cy='14' r='9'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='10.5' cy='14' r='9' fill='%23183B5B'/%3E%3Ccircle cx='17.5' cy='14' r='9' fill='%230F766E'/%3E%3Ccircle cx='17.5' cy='14' r='9' fill='%236FD3C5' clip-path='url(%23c)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #F6F8FB;
    --surface: #FFFFFF;
    --surface-subtle: #F9FBFD;
    --surface-hover: #F3F7FB;

    --text: #0F172A;
    --text-secondary: #475569;
    --text-subtle: #64748B;
    --text-muted: #94A3B8;

    --border: #E5EAF0;
    --border-strong: #D4DCE6;
    --hairline: rgba(15, 23, 42, 0.06);

    --primary: #163B63;
    --primary-hover: #102E4D;
    --primary-soft: #EDF4FA;

    --accent: #0F8A83;
    --accent-ink: #0B7069;
    --accent-soft: #ECF8F6;
    --accent-line: #BFE5E0;

    --success: #16803D;
    --success-soft: #EEF9F1;
    --success-line: #CDE8D6;

    --warning: #C15A08;
    --warning-ink: #A64B05;
    --warning-soft: #FFF7EB;
    --warning-line: #F3DDB9;

    --danger: #B42318;
    --danger-soft: #FEF3F2;
    --danger-line: #F6CFCB;

    --purple: #6D3FE0;
    --purple-soft: #F4F0FF;
    --purple-line: #DDD2FA;

    --info: #2563EB;
    --info-soft: #EFF6FF;
    --info-line: #CFE0FB;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-card: 0 4px 14px rgba(15, 23, 42, 0.04);

    --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --ease: 150ms ease;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  table { border-collapse: collapse; width: 100%; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--text-secondary); }
  .faint { color: var(--text-subtle); }
  svg { flex: none; }

  /* ---------- Application shell ---------- */
  #app { min-height: 100%; }
  .shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 14px 18px 14px; display: flex; flex-direction: column; gap: 30px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  .brand-name { font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .brand-desc { font-size: 11.5px; color: var(--text-subtle); margin-top: -2px; }
  .nav-section { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 10.5px; color: var(--text-subtle); padding: 0 10px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-secondary); font-weight: 500; font-size: 13.5px; transition: all 150ms ease; }
  .nav-item svg { color: var(--text-subtle); transition: all 150ms ease; }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); text-decoration: none; }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav-item.active svg { color: var(--primary); }
  .sidebar-foot { margin-top: auto; padding: 14px 10px 0 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-subtle); line-height: 1.5; }
  .sidebar-foot .foot-title { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text-secondary); margin-bottom: 2px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .mobile-nav { display: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
  .mobile-nav select { border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 8px; background: var(--surface); width: auto; }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .sidebar { display: none; } .mobile-nav { display: flex; } }

  .main { min-width: 0; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 22px 32px 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .crumb { font-size: 12.5px; color: var(--text-subtle); margin-bottom: 6px; }
  .crumb a { color: var(--text-subtle); }
  .crumb a:hover { color: var(--text); text-decoration: none; }
  .page-title { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .page-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  .content { padding: 28px 32px 56px; max-width: 1440px; }
  .content-narrow { max-width: 880px; }
  @media (max-width: 640px) { .topbar, .content { padding-left: 16px; padding-right: 16px; } .page-title { font-size: 21px; } }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; font-size: 13.5px; cursor: pointer; line-height: 1.2; white-space: nowrap; box-shadow: var(--shadow-sm); transition: all 150ms ease; }
  .btn:hover { background: var(--surface-hover); border-color: var(--text-muted); text-decoration: none; }
  .btn-primary { background: var(--primary); border: none; padding: 10px 16px; color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); border: none; transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .btn-quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--text-secondary); }
  .btn-quiet:hover { background: var(--surface-hover); border-color: transparent; color: var(--text); }
  .btn-danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); box-shadow: none; }
  .btn-danger:hover { background: #FCE8E6; border-color: var(--danger-line); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
  .btn-primary.btn-sm { padding: 0 13px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .copy-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 150ms ease; }
  .copy-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }

  /* ---------- Surfaces and sections ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 16px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; }
  .surface { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm); overflow: hidden; }
  .section { margin-top: 32px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .section-title { font-size: 14px; font-weight: 600; }
  .section-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  /* ---------- Metrics ---------- */
  .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .metric-grid { grid-template-columns: minmax(0, 1fr); } }
  .metric-grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  .metric { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-height: 104px; box-shadow: var(--shadow-sm); transition: all 150ms ease; }
  .metric:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .metric::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: transparent; }
  .metric .m-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; }
  .metric .m-value { font-family: var(--font-mono); font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; color: var(--text); }
  .metric .m-hint { font-size: 11.5px; color: var(--text-subtle); margin-top: 8px; }
  .metric.tone-success::before { background: var(--success); }
  .metric.tone-warning::before { background: var(--warning); }
  .metric.tone-purple::before { background: var(--purple); }
  .metric.tone-accent::before { background: var(--accent); }

  /* ---------- Badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; line-height: 1.5; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-success { background: var(--success-soft); color: var(--success); border-color: var(--success-line); }
  .badge-warning { background: var(--warning-soft); color: var(--warning-ink); border-color: var(--warning-line); }
  .badge-purple { background: var(--purple-soft); color: var(--purple); border-color: var(--purple-line); }
  .badge-info { background: var(--info-soft); color: var(--info); border-color: var(--info-line); }
  .badge-neutral { background: var(--surface-subtle); color: var(--text-secondary); border-color: var(--border); }
  .tag-demo { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--primary); background: var(--primary-soft); border-radius: 5px; padding: 2px 7px; }

  /* ---------- Status banner ---------- */
  .status-banner { display: flex; gap: 16px; align-items: flex-start; padding: 20px 24px; border-radius: 12px; border: 1px solid; margin-bottom: 20px; }
  .status-banner .sb-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .status-banner .sb-icon svg { width: 18px; height: 18px; }
  .status-banner .sb-title { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; margin-top: 3px; color: var(--text); }
  .status-banner .sb-body { font-size: 13.5px; font-weight: 400; color: var(--text-secondary); margin-top: 2px; }
  .status-banner .sb-note { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-top: 14px; line-height: 1.6; }
  .status-banner.in { background: var(--success-soft); border-color: var(--success-line); }
  .status-banner.in .sb-icon { background: rgba(22, 128, 61, 0.12); color: var(--success); }
  .status-banner.out { background: var(--warning-soft); border-color: var(--warning-line); }
  .status-banner.out .sb-icon { background: rgba(193, 90, 8, 0.13); color: var(--warning); }

  /* ---------- Tables ---------- */
  .table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .table-wrap.flat { border: none; border-top: 1px solid var(--border); border-radius: 0; }
  .table-wrap.no-max { max-height: none; }
  .table-wrap table.data { min-width: 720px; }
  table.data th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); font-weight: 600; padding: 11px 20px; border-bottom: 1px solid var(--border); background: var(--surface-subtle); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  table.data td { padding: 9px 20px; height: 46px; border-bottom: 1px solid var(--hairline); vertical-align: middle; font-size: 13px; }
  table.data tbody tr { transition: background 150ms ease; }
  table.data tbody tr:hover { background: var(--surface-hover); }
  table.data tbody tr:last-child td { border-bottom: none; }
  .cell-detail { display: block; font-size: 11.5px; color: var(--text-subtle); margin-top: 1px; font-family: var(--font-mono); }
  .table-empty { padding: 44px 20px; text-align: center; color: var(--text-subtle); }
  .dup-count { color: var(--purple); font-weight: 500; }

  /* ---------- Forms ---------- */
  label.field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field-hint { font-size: 12.5px; color: var(--text-subtle); margin-top: 6px; line-height: 1.5; }
  input[type=text], input[type=search], select { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); transition: all 150ms ease; }
  input[type=text]:focus, input[type=search]:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22, 59, 99, 0.12); }
  select:disabled { background: var(--surface-subtle); color: var(--text-muted); }
  input::placeholder { color: var(--text-muted); }
  .field { margin-bottom: 18px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 700px) { .form-grid-2 { grid-template-columns: 1fr; gap: 24px; } }
  .option-list { border-top: 1px solid var(--hairline); }
  .checkbox-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--hairline); }
  .checkbox-row input { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--primary); }
  .checkbox-row label { cursor: pointer; }
  .checkbox-row.disabled label { cursor: not-allowed; opacity: 0.6; }
  .cb-title { font-weight: 500; font-size: 13.5px; }
  .cb-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }
  .req-mark { color: var(--danger); }
  .miss-hint { font-size: 12px; color: var(--danger); margin-top: 5px; }
  .step-h { font-size: 14px; font-weight: 600; margin: 30px 0 4px 0; }

  /* ---------- Wizard stepper ---------- */
  .progress { display: flex; align-items: center; margin-bottom: 26px; flex-wrap: wrap; row-gap: 8px; }
  .p-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--text-subtle); white-space: nowrap; }
  .p-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--border-strong); background: var(--surface); color: #fff; transition: all 150ms ease; }
  .p-step.done { color: var(--text-secondary); }
  .p-step.done .p-dot { background: var(--accent); border-color: var(--accent); }
  .p-step.current { color: var(--text); font-weight: 600; }
  .p-step.current .p-dot { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .p-line { flex: 1 1 20px; min-width: 14px; max-width: 64px; height: 1px; background: var(--border-strong); margin: 0 12px; }
  .p-line.done { background: var(--accent); }
  .wizard-actions { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--hairline); }

  /* ---------- Application profile cards ---------- */
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .profile-card { position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow-sm); transition: all 150ms ease; }
  .profile-card:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--shadow-card); text-decoration: none; }
  .profile-card.selected { border-color: #9BBBD9; background: var(--primary-soft); }
  .profile-card.action { border-style: dashed; border-color: var(--border-strong); background: transparent; box-shadow: none; }
  .profile-card.action:hover { background: var(--surface-hover); }
  .profile-card.action.selected { border-style: solid; border-color: #9BBBD9; background: var(--primary-soft); }
  .profile-card .pc-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; padding-right: 22px; }
  .profile-card .pc-plat { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .profile-card .pc-key { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-secondary); margin-top: 12px; }
  .profile-card .pc-last { font-size: 12px; color: var(--text-subtle); margin-top: 2px; }
  .pc-check { position: absolute; top: 13px; right: 13px; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; }

  /* ---------- Upload ---------- */
  .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 200px; padding: 36px 24px; text-align: center; border: 1.5px dashed #B7CCE3; border-radius: 12px; background: #F5F9FE; color: var(--text-secondary); cursor: pointer; transition: all 150ms ease; }
  .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: #EEF5FC; }
  .dropzone svg { flex: none; width: 52px; height: 52px; padding: 14px; border-radius: 50%; background: var(--surface); color: var(--primary); box-shadow: var(--shadow-card); margin-bottom: 6px; }
  .dropzone input[type="file"] { display: none; }
  .dropzone .dz-main { font-weight: 600; font-size: 14.5px; color: var(--text); }
  .dropzone .dz-sub { font-size: 13px; }
  .dropzone .dz-note { font-size: 12px; color: var(--text-subtle); margin-top: 8px; }
  .file-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); }
  .file-card .fc-icon { width: 26px; height: 26px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: flex; align-items: center; justify-content: center; align-self: flex-start; margin-top: 1px; }
  .file-card .fc-body { flex: 1; min-width: 0; }
  .file-card .fc-name { font-weight: 600; font-family: var(--font-mono); font-size: 13.5px; word-break: break-all; }
  .file-card .fc-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .file-card .fc-hash { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .preview-scroll { overflow: auto; max-height: 300px; border: 1px solid var(--border); border-radius: 12px; }
  .preview-scroll table.data { min-width: 560px; }
  .divider-note { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin: 22px 0 10px 0; }

  .banner { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-subtle); font-size: 13px; color: var(--text-secondary); display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
  .banner svg { margin-top: 2px; }
  .banner.ok { background: var(--success-soft); border-color: var(--success-line); color: var(--success); }
  .banner.warn { background: var(--warning-soft); border-color: var(--warning-line); color: var(--warning-ink); }
  .banner.info { background: var(--info-soft); border-color: var(--info-line); color: var(--info); }
  .banner .b-sub { display: block; font-size: 12.5px; margin-top: 2px; opacity: 0.9; }

  .mapping-col h4 { font-size: 14px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }

  .kv-row { display: grid; grid-template-columns: 210px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-row .k { color: var(--text-secondary); }
  .kv-row .v { min-width: 0; word-break: break-word; }
  .kv-section { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); font-weight: 600; margin: 28px 0 4px 0; }
  .hash { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
  @media (max-width: 640px) { .kv-row { grid-template-columns: 1fr; gap: 2px; } }

  /* ---------- Advanced normalization ---------- */
  .advanced { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-top: 22px; }

  .advanced summary:hover { background: var(--surface-hover); }
  .advanced summary::-webkit-details-marker { display: none; }
  .advanced summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--text-subtle); border-bottom: 1.5px solid var(--text-subtle); transform: rotate(-45deg); transition: transform 150ms ease; margin-right: 4px; }
  .advanced[open] summary::before { transform: rotate(45deg); }
  .advanced[open] summary { border-bottom: 1px solid var(--hairline); border-radius: 12px 12px 0 0; }
  .advanced .adv-body { padding: 16px 18px 18px 18px; }
  .advanced[open] .adv-body { animation: reveal 160ms ease; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .rule-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .rule-grid-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); font-weight: 600; padding-bottom: 8px; }
  .rule-row select, .rule-row input[type=text] { height: 32px; font-size: 13px; }
  .rule-toggles { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .rule-toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .rule-toggles input { accent-color: var(--primary); }
  .rule-error { grid-column: 1 / -1; color: var(--danger); font-size: 11.5px; margin-top: -4px; }
  .rule-error:empty { display: none; }
  @media (max-width: 760px) { .rule-grid { grid-template-columns: 1fr; } .rule-grid-head { display: none; } }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 16px 20px; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-filter { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 150ms ease; }
  .chip-filter:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
  .chip-filter.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .search-input-wrap { position: relative; min-width: 250px; }
  .search-input-wrap input { height: 32px; padding: 0 12px 0 33px; font-size: 13px; }
  .search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

  /* ---------- Lists ---------- */
  .list-row { display: grid; grid-template-columns: 1.7fr 0.85fr 0.85fr 0.85fr 0.65fr 1fr 16px; gap: 14px; align-items: center; padding: 15px 22px; border-bottom: 1px solid var(--hairline); color: inherit; transition: background 150ms ease; }
  .list-row:last-child { border-bottom: none; }
  a.list-row:hover { background: var(--surface-hover); text-decoration: none; }
  .list-head { padding-top: 11px; padding-bottom: 11px; background: var(--surface-subtle); border-bottom: 1px solid var(--border); pointer-events: none; }
  @media (max-width: 900px) { .list-row { grid-template-columns: 1fr; gap: 6px; } .list-head { display: none; } .list-row .chev { display: none; } }
  .lr-name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lr-label { font-size: 11.5px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin: 0; }
  .chev { color: var(--text-muted); }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; }
  .empty-state p { color: var(--text-secondary); max-width: 44ch; margin: 0 auto 20px auto; }

  .trend-chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; }
  .trend-node { padding: 3px 11px; border-radius: 8px; background: var(--surface-subtle); border: 1px solid var(--border); font-weight: 600; }
  .trend-node.zero { background: var(--success-soft); color: var(--success); border-color: var(--success-line); }
  .trend-arrow { color: var(--text-muted); }

  .tree { margin-top: 2px; }
  .tree-cycle { padding: 14px 0; border-bottom: 1px solid var(--hairline); }
  .tree-cycle:last-child { border-bottom: none; }
  .tree-cycle-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
  .tree-runs { margin: 10px 0 0 6px; padding-left: 16px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .tree-run { font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* ---------- Landing ---------- */
  .landing { background: var(--surface); min-height: 100vh; }
  .landing-nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); }
  .hero { padding: 80px 40px 56px 40px; max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
  @media (max-width: 880px) { .hero { grid-template-columns: 1fr; padding-top: 44px; } .landing-nav { padding: 16px 20px; } }
  .hero h1 { font-size: 42px; line-height: 1.12; letter-spacing: -0.03em; font-weight: 600; }
  .hero .sub { margin-top: 18px; font-size: 16.5px; color: var(--text-secondary); max-width: 46ch; line-height: 1.6; }
  .hero .ctas { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
  .hero .btn { padding: 11px 19px; font-size: 14px; }
  .benefits { max-width: 1120px; margin: 0 auto; padding: 8px 40px 84px 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  @media (max-width: 780px) { .benefits { grid-template-columns: 1fr; padding-left: 20px; padding-right: 20px; } }
  .benefit { position: relative; padding-top: 18px; border-top: 1px solid var(--border); }
  .benefit::before { content: ""; position: absolute; top: -1px; left: 0; width: 32px; height: 2px; background: var(--accent); }
  .benefit h3 { font-size: 15px; }
  .benefit p { font-size: 13.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.6; }
  .privacy-strip { background: var(--surface-subtle); border-top: 1px solid var(--border); padding: 16px 32px; text-align: center; font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .venn-wrap { display: flex; justify-content: center; }

  /* ---------- Evidence Summary (audit document) ---------- */
  .evidence-doc { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-card); padding: 56px 64px 48px; max-width: 880px; margin: 0 auto; }
  .ev-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .ev-brand { display: flex; align-items: center; gap: 10px; }
  .ev-brand .b1 { font-weight: 600; font-size: 18px; letter-spacing: -0.02em; line-height: 1.1; }
  .ev-brand .b2 { font-size: 12px; color: var(--text-subtle); }
  .ev-stamp { text-align: right; font-size: 12px; color: var(--text-subtle); line-height: 1.5; }
  .ev-stamp .mono { color: var(--text-secondary); }
  .ev-title { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; margin: 32px 0 0 0; }
  .ev-lede { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .ev-status-sub { font-size: 12.5px; color: var(--text-secondary); margin-left: 10px; }
  .ev-foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-subtle); line-height: 1.6; }
  @media (max-width: 720px) { .evidence-doc { padding: 28px 20px; } }
  @page { margin: 16mm; }
  @media print {
    .sidebar, .topbar, .mobile-nav, .no-print { display: none !important; }
    .shell { display: block; }
    .content { padding: 0; max-width: none; }
    body { background: #fff; }
    .evidence-doc { border: none; box-shadow: none; padding: 0; max-width: none; border-radius: 0; }
    .kv-row { break-inside: avoid; }
    .kv-section { break-after: avoid; }
    .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ============================== UTILITIES ============================== */
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const qs = (sel, root) => (root || document).querySelector(sel);
  const qsa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fmtNum = (n) => Number(n || 0).toLocaleString();
  function fmtPct(n) {
    if (n == null || isNaN(n)) return "—";
    const r = Math.round(n * 10) / 10;
    return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + "%";
  }
  const pctOrDash = (v) => (v == null ? "—" : fmtPct(v));
  function fmtDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtDateTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "—" : fmtDate(iso) + " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  const plural = (n, one, many) => (n === 1 ? one : many);
  function downloadCSV(filename, rows) {
    const blob = new Blob([Papa.unparse(rows)], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ============================== SHA-256 FINGERPRINTS ============================== */
  function fileToArrayBuffer(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error);
      fr.readAsArrayBuffer(file);
    });
  }
  async function sha256Hex(buffer) {
    const subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return null;
    const digest = await subtle.digest("SHA-256", buffer);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const sha256OfFile = (file) => fileToArrayBuffer(file).then(sha256Hex).catch(() => null);
  const sha256OfText = (text) => sha256Hex(new TextEncoder().encode(text)).catch(() => null);
  const shortHash = (h) => (h ? h.slice(0, 6) + "…" + h.slice(-4) : "");
  function hashChip(hash, full) {
    if (!hash) return '<span class="faint">Not recorded</span>';
    return '<span class="hash" title="' + esc(hash) + '">' + esc(full ? hash : shortHash(hash)) + '</span> <button type="button" class="copy-btn no-print" data-copy="' + esc(hash) + '" title="Copy full SHA-256">Copy</button>';
  }

  /* ============================== STORAGE ============================== */
  const STORAGE_KEY = "parity_recon_state_v1";
  const emptyState = () => ({ reconciliations: {}, profiles: {}, settings: {} });
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      const p = JSON.parse(raw);
      return { reconciliations: p.reconciliations || {}, profiles: p.profiles || {}, settings: p.settings || {} };
    } catch (e) { return emptyState(); }
  }
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) { console.error("Storage error", e); } }
  let STATE = loadState();

  const listRecons = () => Object.values(STATE.reconciliations).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const listProfiles = () => Object.values(STATE.profiles).sort((a, b) => a.name.localeCompare(b.name));
  const getRecon = (id) => STATE.reconciliations[id];
  const getProfile = (id) => (id ? STATE.profiles[id] : undefined);
  const latestRun = (r) => (r.runs.length ? r.runs[r.runs.length - 1] : null);
  const reconTitle = (r) => (r.cycle ? r.name + " — " + r.cycle : r.name);
  const comparisonKeyLabel = (includeAccount) => (includeAccount ? "Identity + Account + Entitlement" : "Identity + Entitlement");

  /* ============================== METRICS / STATUS ============================== */
  const trueMismatchCount = (run) => (run.missingFromIgaCount || 0) + (run.missingFromSourceCount || 0);
  const sourceCompletenessValue = (run) => (run.sourceRelationships ? (run.matchedCount / run.sourceRelationships) * 100 : null);
  const igaAlignmentValue = (run) => (run.igaRelationships ? (run.matchedCount / run.igaRelationships) * 100 : null);
  function runStatus(run) {
    return trueMismatchCount(run) > 0 ? { label: "Out of parity", tone: "warning", inParity: false } : { label: "In parity", tone: "success", inParity: true };
  }
  function reconStatus(recon) {
    const run = latestRun(recon);
    return run ? runStatus(run) : { label: "Needs review", tone: "neutral", inParity: false };
  }
  const formattingCount = (run) => run.exceptions.filter((e) => e.exceptionType === "Formatting / normalized match" || e.exceptionType === "Custom-rule normalized match").length;
  const statusBadge = (s) => '<span class="badge badge-' + s.tone + '"><span class="dot"></span>' + s.label + "</span>";

  /* ============================== NORMALIZATION + COMPARISON ENGINE ============================== */
  const RULE_SCOPES = [
    { value: "all", label: "All fields" },
    { value: "identity", label: "Identity (both files)" },
    { value: "entitlement", label: "Entitlement (both files)" },
    { value: "source-identity", label: "Source — Identity" },
    { value: "source-entitlement", label: "Source — Entitlement" },
    { value: "iga-identity", label: "IGA — Identity" },
    { value: "iga-entitlement", label: "IGA — Entitlement" }
  ];
  const ruleScopeLabel = (v) => (RULE_SCOPES.find((s) => s.value === v) || { label: v }).label;
  function ruleAppliesTo(scope, side, field) {
    if (scope === "all") return true;
    if (scope === "identity") return field === "identity";
    if (scope === "entitlement") return field === "entitlement";
    if (scope === side + "-identity") return field === "identity";
    if (scope === side + "-entitlement") return field === "entitlement";
    return false;
  }
  const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function applyOneRule(value, rule) {
    if (!rule.find) return { value, error: null };
    try {
      const re = new RegExp(rule.useRegex ? rule.find : escapeRegExp(rule.find), rule.matchCase ? "g" : "gi");
      return { value: value.replace(re, rule.replace || ""), error: null };
    } catch (e) { return { value, error: "Invalid pattern" }; }
  }
  function applyCustomRules(value, rules, side, field) {
    let s = value;
    (rules || []).forEach((rule) => { if (ruleAppliesTo(rule.scope, side, field)) s = applyOneRule(s, rule).value; });
    return s;
  }
  function normalizeBasic(v, opts) {
    let s = v == null ? "" : String(v);
    if (opts.trim) s = s.trim();
    if (opts.dedupeSpaces) s = s.replace(/\s+/g, " ");
    if (opts.caseInsensitive) s = s.toLowerCase();
    return s;
  }
  function normalizeValue(v, opts, ctx) {
    let s = v == null ? "" : String(v);
    if (ctx && opts.customRules && opts.customRules.length) s = applyCustomRules(s, opts.customRules, ctx.side, ctx.field);
    return normalizeBasic(s, opts);
  }

  const KEY_SEP = "\u0001";
  const str = (v) => (v == null ? "" : String(v));
  const display = (v) => (v == null || v === "" ? "(blank)" : v);

  function buildGroups(rows, mapping, opts, side, useAccount) {
    const map = {};
    rows.forEach((row) => {
      const rawIdentity = row[mapping.identity];
      const rawEntitlement = row[mapping.entitlement];
      const rawAccount = useAccount ? row[mapping.account] : undefined;
      const nId = normalizeValue(rawIdentity, opts, { side, field: "identity" });
      const nEnt = normalizeValue(rawEntitlement, opts, { side, field: "entitlement" });
      if (opts.ignoreBlank && (!nId || !nEnt)) return;
      const nAcct = useAccount ? normalizeValue(rawAccount, opts, { side, field: "account" }) : "";
      const key = useAccount ? nId + KEY_SEP + nAcct + KEY_SEP + nEnt : nId + KEY_SEP + nEnt;
      const g = map[key] || (map[key] = { count: 0, variants: {} });
      g.count++;
      const vk = str(rawIdentity) + KEY_SEP + str(rawAccount) + KEY_SEP + str(rawEntitlement);
      const v = g.variants[vk] || (g.variants[vk] = { rawIdentity, rawEntitlement, rawAccount, count: 0 });
      v.count++;
    });
    return map;
  }
  function primaryVariant(group) {
    let best = null;
    Object.keys(group.variants).forEach((k) => { if (!best || group.variants[k].count > best.count) best = group.variants[k]; });
    return best;
  }
  const rawEqual = (a, b, useAcct) => str(a.rawIdentity) === str(b.rawIdentity) && str(a.rawEntitlement) === str(b.rawEntitlement) && (!useAcct || str(a.rawAccount) === str(b.rawAccount));
  function basicEqual(a, b, opts, useAcct) {
    return normalizeBasic(a.rawIdentity, opts) === normalizeBasic(b.rawIdentity, opts) &&
      normalizeBasic(a.rawEntitlement, opts) === normalizeBasic(b.rawEntitlement, opts) &&
      (!useAcct || normalizeBasic(a.rawAccount, opts) === normalizeBasic(b.rawAccount, opts));
  }
  const variantText = (v, useAcct) => "\u201c" + display(v.rawIdentity) + (useAcct ? " / " + display(v.rawAccount) : "") + " / " + display(v.rawEntitlement) + "\u201d";
  const TYPE_ORDER = ["Missing from IGA", "Missing from Source", "Duplicate", "Custom-rule normalized match", "Formatting / normalized match"];

  /* Compares the two populations. Duplicates are collapsed to one relationship for matching,
     but every detected duplicate is always reported as its own "Duplicate" exception. */
  function runComparison(sourceRows, igaRows, mapping, opts, includeAccount) {
    const useAcct = !!(includeAccount && mapping.source.account && mapping.iga.account);
    const src = buildGroups(sourceRows, mapping.source, opts, "source", useAcct);
    const iga = buildGroups(igaRows, mapping.iga, opts, "iga", useAcct);
    const keys = new Set(Object.keys(src).concat(Object.keys(iga)));
    const exceptions = [];
    let matched = 0;

    keys.forEach((key) => {
      const s = src[key], i = iga[key];
      const sv = s ? primaryVariant(s) : null;
      const iv = i ? primaryVariant(i) : null;
      const shown = sv || iv;
      const base = { identity: shown.rawIdentity, entitlement: shown.rawEntitlement, account: useAcct ? shown.rawAccount : undefined };
      const cnt = (g) => (g ? (g.count > 1 ? "Present (\u00d7" + g.count + ")" : "Present") : "Absent");
      if (s && i) {
        matched++;
        if (!rawEqual(sv, iv, useAcct)) {
          exceptions.push(Object.assign({}, base, {
            sourceStatus: "Present — " + variantText(sv, useAcct), igaStatus: "Present — " + variantText(iv, useAcct),
            exceptionType: basicEqual(sv, iv, opts, useAcct) ? "Formatting / normalized match" : "Custom-rule normalized match"
          }));
        }
      } else if (s) {
        exceptions.push(Object.assign({}, base, { sourceStatus: cnt(s), igaStatus: "Absent", exceptionType: "Missing from IGA" }));
      } else {
        exceptions.push(Object.assign({}, base, { sourceStatus: "Absent", igaStatus: cnt(i), exceptionType: "Missing from Source" }));
      }
      if ((s && s.count > 1) || (i && i.count > 1)) {
        exceptions.push(Object.assign({}, base, { sourceStatus: cnt(s), igaStatus: cnt(i), exceptionType: "Duplicate" }));
      }
    });

    exceptions.sort((a, b) => TYPE_ORDER.indexOf(a.exceptionType) - TYPE_ORDER.indexOf(b.exceptionType) ||
      str(a.identity).localeCompare(str(b.identity)) || str(a.entitlement).localeCompare(str(b.entitlement)));
    const count = (t) => exceptions.filter((e) => e.exceptionType === t).length;
    return {
      includeAccount: useAcct,
      sourceRelationships: Object.keys(src).length,
      igaRelationships: Object.keys(iga).length,
      matchedCount: matched,
      missingFromIgaCount: count("Missing from IGA"),
      missingFromSourceCount: count("Missing from Source"),
      duplicateCount: count("Duplicate"),
      exceptions
    };
  }

  /* ============================== CSV PARSING ============================== */
  function parseCSVFile(file) {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        header: true, skipEmptyLines: "greedy",
        complete: (r) => resolve({ data: r.data, fields: r.meta.fields || [], rowCount: r.data.length }),
        error: reject
      });
    });
  }

  /* ============================== RUN RECORDS ============================== */
  const DEFAULT_NORM = { trim: true, caseInsensitive: true, dedupeSpaces: true, ignoreBlank: true, ignoreDuplicates: true, customRules: [] };
  const cloneNorm = (n) => Object.assign({}, DEFAULT_NORM, clone(n || {}), { customRules: clone((n && n.customRules) || []) });

  function pushRun(recon, meta, result, timestamp) {
    recon.runs.push({
      runNumber: recon.runs.length + 1, timestamp: timestamp || new Date().toISOString(),
      sourceFileName: meta.sourceFileName, igaFileName: meta.igaFileName,
      sourceRowCount: meta.sourceRowCount, igaRowCount: meta.igaRowCount,
      sourceFileHash: meta.sourceFileHash || null, igaFileHash: meta.igaFileHash || null,
      includeAccount: !!result.includeAccount,
      sourceRelationships: result.sourceRelationships, igaRelationships: result.igaRelationships,
      matchedCount: result.matchedCount, missingFromIgaCount: result.missingFromIgaCount,
      missingFromSourceCount: result.missingFromSourceCount, duplicateCount: result.duplicateCount,
      exceptions: result.exceptions, normalization: meta.normalization
    });
  }

  /* ============================== DEMO DATA ============================== */
  const DEMO_VERSION = 2;
  const DEMO_MAPPING = {
    source: { identity: "Employee ID", entitlement: "Access Code", account: "Account", application: "Application", displayName: "User Name" },
    iga: { identity: "Identity ID", entitlement: "Entitlement", account: "Account Name", application: "Source App", description: "Description", displayName: "Display Name" }
  };
  function buildDemoDataset() {
    const base = [
      ["100023", "AP_APPROVER"], ["100024", "GL_READ"], ["100025", "PO_CREATE"], ["100026", "FIN_ADMIN"], ["100027", "AP_CLERK"], ["100028", "GL_POST"],
      ["100029", "PO_APPROVE"], ["100030", "FIN_VIEWER"], ["100031", "AR_ADJUST"], ["100032", "INV_CONTROL"], ["100033", "AP_APPROVER"], ["100034", "GL_READ"],
      ["100035", "PO_CREATE"], ["100036", "CASH_MGMT"], ["100037", "TAX_ADMIN"], ["100038", "FIN_ADMIN"], ["100039", "AP_CLERK"], ["100040", "GL_POST"],
